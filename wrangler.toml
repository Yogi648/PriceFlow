name = "priceflow-storage-api"
main = "src/index.js"
compatibility_date = "2026-09-25"

[[r2_buckets]]
binding = "BACKEND_BUCKET"
bucket_name = "priceflow-backend"

[[kv_namespaces]]
binding = "BACKEND_META"
id = "replace-with-your-kv-namespace-id"

[vars]
ALLOWED_ORIGIN = "https://your-public-site.example"
# Set STORAGE_API_KEY with: wrangler secret put STORAGE_API_KEY
